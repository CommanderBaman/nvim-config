# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
includes:
    base:
        taskfile: ./src/hooks/base.yaml
        flatten: true
        vars:
            GRIMOIRE_DIR: .
    yaml:
        taskfile: ./src/commands/yamlfmt.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: .
    taplo:
        taskfile: ./src/commands/taplo.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: .
    mdsf:
        taskfile: ./src/commands/mdsf.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: .
    mdslw:
        taskfile: ./src/commands/mdslw.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: .
silent: true
tasks:
    format:
        desc: format all files in the project
        aliases:
        - fmt
        cmds:
        - task: yaml:format
        - task: mdslw:format
        - task: mdsf:format
        - task: taplo:format
    format:check:
        desc: check if all files in project are formatted properly
        cmds:
        - task: yaml:format:check
        - task: mdslw:format:check
        - task: mdsf:format:check
        - task: taplo:format:check
    format:files:
        desc: format specific files in repository. usage = task format:files FILES="a b"
        requires:
            vars: [FILES]
        cmds:
        - task: yaml:format:files
        - task: mdslw:format:files
        - task: mdsf:format:files
        - task: taplo:format:files
    lint:
        desc: check for lint errors in the project
        cmds:
        - task: yaml:lint
        - task: mdslw:lint
        - task: mdsf:lint
        - task: taplo:lint
    lint:files:
        desc: check for lint errors in specific files. usage = task lint:files = FILES="a b"
        requires:
            vars: [FILES]
        cmds:
        - task: yaml:lint:files
        - task: mdslw:lint:files
        - task: mdsf:lint:files
        - task: taplo:lint:files
    test:
        desc: test if repository is working as intended
        cmds:
        - echo "no tests for this repository defined till now"
