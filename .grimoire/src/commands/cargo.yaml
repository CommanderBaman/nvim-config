# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
includes:
    variables:
        taskfile: ../common/variables.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: '{{.GRIMOIRE_DIR}}'
tasks:
    ensure:
        desc: check if cargo is present and setup
        internal: true
        preconditions:
        - sh: cargo --version
          msg: cargo must be installed to run cargo commands
    clean:
        desc: clean files generated by cargo
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo clean {{.FLAGS}}
    init:format:
        desc: initialize the config for format
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        preconditions:
        # either default present or already present in repo
        - sh: "[ -f {{.CONFIG_DIR}}/rustfmt.toml -o -f rustfmt.toml ]"
          msg: default attributes config must be present
        # successful if config is present
        status:
        - "[ -f rustfmt.toml ]"
        cmds:
        - cp {{.CONFIG_DIR}}/rustfmt.toml rustfmt.toml
    format:check:
        desc: check if formatting is correct for all files
        internal: true
        cmds:
        - task: format
          vars:
            FLAGS: --check
    format:
        desc: formal all rust files present in folder
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo fmt {{.FLAGS}}
    build:debug:
        desc: build the debug build
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo build {{.FLAGS}}
    build:release:
        desc: build the release build
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo build --release {{.FLAGS}}
    clippy:
        desc: run clippy on all files
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo clippy {{.FLAGS}}
    lint:
        desc: lint all files
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        cmds:
        - task: clippy
          vars:
            FLAGS: -- -D warnings
    run:
        desc: run the project
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo run {{.FLAGS}}
    test:
        desc: test the project
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        deps:
        - task: ensure
        cmds:
        - cargo test {{.FLAGS}}
