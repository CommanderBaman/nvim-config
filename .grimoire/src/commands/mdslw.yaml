# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"
includes:
    fd:
        taskfile: ./fd.yaml
        internal: true
        vars:
            GRIMOIRE_DIR: '{{.GRIMOIRE_DIR}}'
vars:
    MDSLW_COMMAND: 'mdslw'
    MDSLW_FORMAT_COMMAND: '{{.MDSLW_COMMAND}}'
    MDSLW_FORMAT_CHECK_COMMAND: '{{.MDSLW_COMMAND}} --mode check'
tasks:
    ensure:
        desc: check if mdslw is present and setup
        internal: true
        preconditions:
        - sh: mdslw -version
          msg: mdslw must be installed to run mdslw commands
    format:
        desc: format all markdown files present in folder
        internal: true
        deps:
        - task: ensure
        cmds:
        - task: fd:exec
          vars:
            COMMAND: '{{.MDSLW_FORMAT_COMMAND}}'
            EXTENSIONS:
            - md
    format:files:
        desc: format all markdown files
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        requires:
            vars: [FILES]
        deps:
        - task: ensure
        cmds:
        - '{{.MDSLW_FORMAT_COMMAND}} {{.FILES}}'
    format:check:
        desc: check formatting of all markdown files
        internal: true
        deps:
        - task: ensure
        cmds:
        - task: fd:exec
          vars:
            COMMAND: '{{.MDSLW_FORMAT_CHECK_COMMAND}}'
            EXTENSIONS:
            - md
    format:check:files:
        desc: check formatting of given markdown files
        dir: '{{.USER_WORKING_DIR}}'
        internal: true
        requires:
            vars: [FILES]
        deps:
        - task: ensure
        cmds:
        - '{{.MDSLW_FORMAT_CHECK_COMMAND}} {{.FILES}}'
    lint:
        desc: lint all markdown files
        internal: true
        cmds:
        - task: format:check
    lint:files:
        desc: lint given markdown files
        internal: true
        requires:
            vars: [FILES]
        cmds:
        - task: format:check:files
